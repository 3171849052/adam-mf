[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "adam-mf"
version = "0.1.0"
description = "Offline reproduction of six frozen optimizers on ten seeds"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.13.0+cu126", "torchvision==0.28.0+cu126", "timm==1.0.29", "transformers==5.15.0",
  "opacus==1.6.0", "numpy==2.4.4", "scipy==1.17.1", "scikit-learn==1.9.0",
  "pandas==3.0.5", "pyarrow==25.0.1", "safetensors==0.8.0", "PyYAML==6.0.3",
  "matplotlib==3.11.1", "pytest==9.1.1"
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
